<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f4efe4" />
    <title>欧建锋，生日快乐</title>
    <link rel="stylesheet" href="public/page-transition.css" />
    <style>
      :root {
        --ink: #141414;
        --paper: #f4efe4;
        --coral: #ff6b6b;
        --gold: #ffd166;
        --teal: #06d6a0;
        --blue: #4cc9f0;
      }

      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }

      html,
      body {
        height: 100%;
        margin: 0;
      }

      body {
        background: var(--paper);
        color: var(--ink);
        font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei",
          "Noto Sans SC", sans-serif;
        -webkit-font-smoothing: antialiased;
      }

      [hidden] {
        display: none !important;
      }

      .page {
        min-height: 100%;
      }

      .hero {
        position: relative;
        width: 100%;
        height: 100svh;
        min-height: 560px;
        overflow: hidden;
        background: var(--paper);
      }

      .halftone-reveal {
        position: absolute;
        inset: 0;
      }

      .halftone-reveal canvas {
        display: block;
        width: 100%;
        height: 100%;
        touch-action: none;
      }

      .hero-content {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        pointer-events: none;
      }

      .hero-intro,
      .hero-greeting {
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
      }

      .hero-intro {
        gap: 26px;
      }

      .hero-hint {
        margin: 0;
        padding: 10px 18px;
        border-radius: 6px;
        background: rgba(244, 239, 228, 0.86);
        color: #4b4438;
        font-size: clamp(14px, 1.8vw, 18px);
        font-weight: 600;
        letter-spacing: 0.32em;
        text-indent: 0.32em;
      }

      .surprise-btn {
        pointer-events: auto;
        border: 2px solid var(--ink);
        border-radius: 8px;
        background: var(--paper);
        color: var(--ink);
        font-family: inherit;
        font-weight: 800;
        letter-spacing: 0.16em;
        cursor: pointer;
        box-shadow: 6px 6px 0 var(--ink);
        transition: transform 0.18s ease, box-shadow 0.18s ease,
          background-color 0.18s ease;
      }

      .surprise-btn {
        padding: 18px 40px;
        font-size: clamp(18px, 3vw, 26px);
        animation: pulse 2.2s ease-in-out infinite;
      }

      .surprise-btn:hover {
        transform: translate(-2px, -2px) scale(1.03);
        box-shadow: 9px 9px 0 var(--ink);
        background: #fffaf0;
      }

      .surprise-btn:active {
        transform: translate(3px, 3px);
        box-shadow: 2px 2px 0 var(--ink);
      }

      .surprise-btn:focus-visible {
        outline: 3px solid var(--coral);
        outline-offset: 3px;
      }

      @keyframes pulse {
        0%,
        100% {
          transform: scale(1);
        }
        50% {
          transform: scale(1.04);
        }
      }

      .hero-greeting {
        gap: 14px;
        padding: 28px 22px;
        pointer-events: auto;
        animation: rise 0.7s cubic-bezier(0.2, 0.8, 0.2, 1) both;
      }

      .greeting-title {
        position: relative;
        width: min(92vw, 920px);
        height: clamp(120px, 28vw, 320px);
        margin: 0;
        border: 1px solid rgba(255, 255, 255, 0.35);
        border-radius: 14px;
        background-color: rgba(20, 20, 20, 0.2);
        background-image: linear-gradient(
          135deg,
          rgba(255, 255, 255, 0.32),
          rgba(255, 255, 255, 0.1)
        );
        box-shadow: 0 12px 40px rgba(20, 20, 20, 0.18),
          inset 0 1px 0 rgba(255, 255, 255, 0.4);
        backdrop-filter: blur(22px) saturate(180%);
        -webkit-backdrop-filter: blur(22px) saturate(180%);
      }

      .warp-canvas {
        display: inline-block;
        width: 100%;
        height: 100%;
        border-radius: 14px;
      }

      .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
      }

      .opening-date {
        margin: 0;
        color: #ffffff;
        text-shadow: 0 1px 3px rgba(20, 20, 20, 0.35);
        font-size: clamp(22px, 4vw, 44px);
        font-weight: 700;
        letter-spacing: 0.05em;
        line-height: 1.6;
        max-width: 92vw;
        text-wrap: balance;
      }

      .next-btn {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        padding: 18px 40px;
        border: 2px solid var(--ink);
        border-radius: 8px;
        background: var(--paper);
        color: var(--ink);
        font-family: inherit;
        font-size: clamp(19px, 3vw, 26px);
        font-weight: 800;
        letter-spacing: 0.16em;
        text-decoration: none;
        box-shadow: 6px 6px 0 var(--ink);
        transition: transform 0.18s ease, box-shadow 0.18s ease,
          background-color 0.18s ease;
      }

      .next-btn svg {
        width: 24px;
        height: 24px;
        fill: none;
        stroke: currentColor;
        stroke-width: 2;
        stroke-linecap: round;
        stroke-linejoin: round;
      }

      .next-wrap {
        position: fixed;
        bottom: 30px;
        left: 0;
        right: 0;
        z-index: 12;
        display: flex;
        justify-content: center;
        pointer-events: none;
      }

      .next-btn {
        pointer-events: auto;
      }

      .next-btn:hover {
        transform: translate(-2px, -2px) scale(1.03);
        box-shadow: 9px 9px 0 var(--ink);
        background: #fffaf0;
      }

      .next-btn:active {
        transform: translate(3px, 3px);
        box-shadow: 2px 2px 0 var(--ink);
      }

      .next-btn:focus-visible {
        outline: 3px solid var(--coral);
        outline-offset: 3px;
      }

      @keyframes rise {
        from {
          opacity: 0;
          transform: translateY(24px) scale(0.96);
        }
        to {
          opacity: 1;
          transform: none;
        }
      }

      .confetti {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
        z-index: 10;
      }

      @media (prefers-reduced-motion: reduce) {
        .surprise-btn {
          animation: none;
        }

        .hero-greeting {
          animation: none;
        }

        .warp-canvas {
          filter: none;
        }
      }
    </style>
  </head>
  <body>
    <main class="page">
      <section class="hero" aria-label="生日惊喜首页">
        <div class="halftone-reveal" id="halftone"></div>

        <div class="hero-content">
          <div class="hero-intro" id="intro">
            <p class="hero-hint">点一下，拆开今天的惊喜</p>
            <button class="surprise-btn" id="surpriseBtn" type="button">
              SURPRISE
            </button>
          </div>

          <div class="hero-greeting" id="greeting" hidden>
            <h1 class="greeting-title" id="warpTitle">
              <span class="sr-only">欧建锋，生日快乐！</span>
              <canvas class="warp-canvas" id="warpCanvas" aria-hidden="true"></canvas>
            </h1>
            <p class="opening-date">2026年8月11日 · 十九岁生日快乐</p>
          </div>
          <div class="next-wrap" id="nextWrap" hidden>
            <a class="next-btn" href="letter.html">
              点开祝福
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M5 12h14M13 6l6 6-6 6" />
              </svg>
            </a>
          </div>
        </div>
      </section>

      <canvas id="confetti" class="confetti" aria-hidden="true"></canvas>
    </main>

    <script>
      (function () {
        "use strict";

        var TAU = Math.PI * 2;

        function clamp(value, min, max) {
          return Math.min(max, Math.max(min, value));
        }

        function drawCover(ctx, image, width, height) {
          var scale = Math.max(width / image.width, height / image.height);
          var drawWidth = image.width * scale;
          var drawHeight = image.height * scale;
          ctx.drawImage(
            image,
            (width - drawWidth) / 2,
            (height - drawHeight) / 2,
            drawWidth,
            drawHeight
          );
        }

        function createSourceCanvas(image) {
          var canvas = document.createElement("canvas");
          var maxEdge = 1800;
          var scale = Math.min(
            1,
            maxEdge / Math.max(image.naturalWidth, image.naturalHeight)
          );
          canvas.width = Math.max(1, Math.round(image.naturalWidth * scale));
          canvas.height = Math.max(1, Math.round(image.naturalHeight * scale));
          canvas
            .getContext("2d")
            .drawImage(image, 0, 0, canvas.width, canvas.height);
          return canvas;
        }

        function buildPattern(sourceCanvas, width, height, options) {
          var inkColor = options.inkColor;
          var paperColor = options.paperColor;
          var mode = options.mode;
          var dotDensity = options.dotDensity;
          var angle = options.angle;
          var canvas = document.createElement("canvas");
          canvas.width = Math.max(1, Math.round(width));
          canvas.height = Math.max(1, Math.round(height));
          var ctx = canvas.getContext("2d");

          ctx.fillStyle = paperColor;
          ctx.fillRect(0, 0, canvas.width, canvas.height);

          var grid = Math.max(6, 18 - dotDensity * 0.1);
          var maxRadius = grid * 0.78;
          var sourceCtx = sourceCanvas.getContext("2d");
          var pixels = sourceCtx.getImageData(
            0,
            0,
            sourceCanvas.width,
            sourceCanvas.height
          ).data;

          function drawChannel(channelAngle, intensityFromPixel, color, alpha) {
            var rad = ((angle + channelAngle) * Math.PI) / 180;
            var cos = Math.cos(rad);
            var sin = Math.sin(rad);
            ctx.fillStyle = color;
            ctx.globalAlpha = alpha === undefined ? 1 : alpha;

            for (var u = -grid; u < width + grid; u += grid) {
              for (var v = -grid; v < height + grid; v += grid) {
                var x = u * cos - v * sin;
                var y = u * sin + v * cos;
                var sx = clamp(
                  Math.round((x / width) * (sourceCanvas.width - 1)),
                  0,
                  sourceCanvas.width - 1
                );
                var sy = clamp(
                  Math.round((y / height) * (sourceCanvas.height - 1)),
                  0,
                  sourceCanvas.height - 1
                );
                var index = (sy * sourceCanvas.width + sx) * 4;
                var intensity = intensityFromPixel(
                  pixels[index],
                  pixels[index + 1],
                  pixels[index + 2]
                );
                var radius = intensity * maxRadius;
                if (radius < 0.4) continue;

                ctx.beginPath();
                ctx.arc(x, y, radius, 0, TAU);
                ctx.fill();
              }
            }
          }

          if (mode === "color") {
            drawChannel(15, function (r) { return 1 - r / 255; }, "#19b5fe", 0.92);
            drawChannel(75, function (_, g) { return 1 - g / 255; }, "#ff3d81", 0.92);
            drawChannel(0, function (_, __, b) { return 1 - b / 255; }, "#ffd200", 0.92);
            drawChannel(45, function (r, g, b) { return 1 - Math.max(r, g, b) / 255; }, inkColor, 0.9);
          } else {
            drawChannel(
              0,
              function (r, g, b) {
                return 1 - (0.299 * r + 0.587 * g + 0.114 * b) / 255;
              },
              inkColor
            );
          }

          ctx.globalAlpha = 1;
          return canvas;
        }

        var wrapper = document.getElementById("halftone");
        var canvas = document.createElement("canvas");
        wrapper.appendChild(canvas);
        var ctx = canvas.getContext("2d");
        var width = 1;
        var height = 1;
        var dpr = Math.min(window.devicePixelRatio || 1, 2);

        var state = {
          sourceCanvas: null,
          patternCanvas: null,
          pointerX: 0.5,
          pointerY: 0.5,
          targetX: 0.5,
          targetY: 0.5,
          reveal: 0
        };

        var currentMode = "mono";
        var currentRevealRadius = 0.28;

        function rebuildPattern() {
          if (!state.sourceCanvas) return;
          state.patternCanvas = buildPattern(state.sourceCanvas, width, height, {
            inkColor: "#141414",
            paperColor: "#f4efe4",
            mode: currentMode,
            dotDensity: 90,
            angle: 28
          });
        }

        function resize() {
          var rect = wrapper.getBoundingClientRect();
          width = Math.max(1, rect.width);
          height = Math.max(1, rect.height);
          dpr = Math.min(window.devicePixelRatio || 1, 2);
          canvas.width = Math.round(width * dpr);
          canvas.height = Math.round(height * dpr);
          rebuildPattern();
        }

        function frame() {
          var reduceMotion = window.matchMedia(
            "(prefers-reduced-motion: reduce)"
          ).matches;
          var ease = reduceMotion ? 1 : 0.07;
          state.pointerX += (state.targetX - state.pointerX) * ease;
          state.pointerY += (state.targetY - state.pointerY) * ease;
          state.reveal += (currentRevealRadius - state.reveal) * ease;

          ctx.clearRect(0, 0, canvas.width, canvas.height);
          ctx.save();
          ctx.scale(dpr, dpr);
          ctx.fillStyle = "#f4efe4";
          ctx.fillRect(0, 0, width, height);

          if (state.patternCanvas) {
            ctx.drawImage(state.patternCanvas, 0, 0, width, height);
          }

          if (state.sourceCanvas) {
            var centerX = state.pointerX * width;
            var centerY = state.pointerY * height;
            var radius = state.reveal * Math.min(width, height);
            ctx.save();
            ctx.beginPath();
            ctx.arc(centerX, centerY, Math.max(1, radius), 0, TAU);
            ctx.clip();
            drawCover(ctx, state.sourceCanvas, width, height);
            ctx.restore();
          }

          ctx.restore();
          requestAnimationFrame(frame);
        }

        function handlePointer(event) {
          var rect = wrapper.getBoundingClientRect();
          state.targetX = clamp((event.clientX - rect.left) / rect.width, 0, 1);
          state.targetY = clamp((event.clientY - rect.top) / rect.height, 0, 1);
        }

        var image = new Image();
        image.onload = function () {
          state.sourceCanvas = createSourceCanvas(image);
          rebuildPattern();
        };
        image.onerror = function () {
          var fallback = document.createElement("canvas");
          fallback.width = 1200;
          fallback.height = 800;
          var fallbackCtx = fallback.getContext("2d");
          var gradient = fallbackCtx.createLinearGradient(0, 0, 1200, 800);
          gradient.addColorStop(0, "#ffb26b");
          gradient.addColorStop(0.55, "#ff6b6b");
          gradient.addColorStop(1, "#5b8bff");
          fallbackCtx.fillStyle = gradient;
          fallbackCtx.fillRect(0, 0, 1200, 800);
          fallbackCtx.fillStyle = "rgba(20,20,20,0.18)";
          for (var i = 0; i < 34; i += 1) {
            fallbackCtx.save();
            fallbackCtx.translate(
              60 + ((i * 137) % 1080),
              70 + ((i * 89) % 660)
            );
            fallbackCtx.rotate((i * 47 * Math.PI) / 180);
            fallbackCtx.fillRect(-18, -7, 36, 14);
            fallbackCtx.restore();
          }
          state.sourceCanvas = fallback;
          rebuildPattern();

            confettiPieces.push({
              x: Math.random() * window.innerWidth,
              y: -40 - Math.random() * window.innerHeight * 0.45,
              w: 7 + Math.random() * 8,
              h: 10 + Math.random() * 12,
              rotation: Math.random() * TAU,
              spin: -0.12 + Math.random() * 0.24,
              vx: -0.8 + Math.random() * 1.6,
              vy: 1.4 + Math.random() * 2.4,
              sway: Math.random() * TAU,
              color: confettiColors[
                Math.floor(Math.random() * confettiColors.length)
              ]
            });
          }

          for (var b = 0; b < 10; b += 1) {
            balloons.push({
              x: 40 + Math.random() * (window.innerWidth - 80),
              y: window.innerHeight + 60 + Math.random() * window.innerHeight * 0.4,
              r: 30 + Math.random() * 22,
              sway: Math.random() * TAU,
              speed: 0.6 + Math.random() * 0.9,
              color: balloonColors[
                Math.floor(Math.random() * balloonColors.length)
              ]
            });
          }

          if (!confettiFrame) {
            confettiFrame = requestAnimationFrame(drawConfetti);
          }
        }

        function drawConfetti(time) {
          var reduceMotion = window.matchMedia(
            "(prefers-reduced-motion: reduce)"
          ).matches;
          var confettiDpr = Math.min(window.devicePixelRatio || 1, 2);
          confettiCtx.clearRect(0, 0, confettiCanvas.width, confettiCanvas.height);
          confettiCtx.save();
          confettiCtx.scale(confettiDpr, confettiDpr);

          for (var i = 0; i < confettiPieces.length; i += 1) {
            var piece = confettiPieces[i];
            piece.sway += 0.025;
            piece.rotation += piece.spin;
            piece.x += piece.vx + Math.sin(piece.sway) * 0.7;
            piece.y += piece.vy;
            confettiCtx.save();
            confettiCtx.translate(piece.x, piece.y);
            confettiCtx.rotate(piece.rotation);
            confettiCtx.fillStyle = piece.color;
            confettiCtx.fillRect(-piece.w / 2, -piece.h / 2, piece.w, piece.h);
            confettiCtx.restore();
          }

          for (var b = 0; b < balloons.length; b += 1) {
            var balloon = balloons[b];
            balloon.sway += 0.015;
            balloon.y -= balloon.speed;
            balloon.x += Math.sin(balloon.sway) * 0.8;

            confettiCtx.fillStyle = balloon.color;
            confettiCtx.beginPath();
            confettiCtx.ellipse(
              balloon.x,
              balloon.y,
              balloon.r,
              balloon.r * 1.18,
              0,
              0,
              TAU
            );
            confettiCtx.fill();

            confettiCtx.fillStyle = "rgba(255,255,255,0.28)";
            confettiCtx.beginPath();
            confettiCtx.ellipse(
              balloon.x - balloon.r * 0.34,
              balloon.y - balloon.r * 0.32,
              balloon.r * 0.16,
              balloon.r * 0.3,
              -0.5,
              0,
              TAU
            );
            confettiCtx.fill();

            confettiCtx.fillStyle = "rgba(20,20,20,0.75)";
            confettiCtx.beginPath();
            confettiCtx.moveTo(balloon.x, balloon.y + balloon.r * 1.18);
            confettiCtx.lineTo(balloon.x - 5, balloon.y + balloon.r * 1.18 + 8);
            confettiCtx.lineTo(balloon.x + 5, balloon.y + balloon.r * 1.18 + 8);
            confettiCtx.closePath();
            confettiCtx.fill();

            confettiCtx.strokeStyle = "rgba(20,20,20,0.5)";
            confettiCtx.lineWidth = 1.5;
            confettiCtx.beginPath();
            confettiCtx.moveTo(balloon.x, balloon.y + balloon.r * 1.18 + 8);
            confettiCtx.quadraticCurveTo(
              balloon.x + 8,
              balloon.y + balloon.r * 1.18 + 28,
              balloon.x - 4,
              balloon.y + balloon.r * 1.18 + 54
            );
            confettiCtx.stroke();
          }

          confettiCtx.restore();
          confettiFrame = 0;
          if (time - confettiStartedAt < confettiDuration && !reduceMotion) {
            confettiFrame = requestAnimationFrame(drawConfetti);
          }
        }

        var greetingEl = document.getElementById("greeting");
        var warpTitle = document.getElementById("warpTitle");
        var warpCanvas = document.getElementById("warpCanvas");
        var warpCtx = warpCanvas.getContext("2d");
        var textCanvas = document.createElement("canvas");
        var warpFrame = 0;
        var warpRunning = false;
        var warpPointerX = 0.5;
        var warpPointerY = 0.5;
        var warpText = "\u6b27\u5efa\u950b\uff0c\u751f\u65e5\u5feb\u4e50\uff01";

        function renderWarpText() {
          var rect = warpTitle.getBoundingClientRect();
          if (!rect.width || !rect.height) return;

          var dpr = Math.min(window.devicePixelRatio || 1, 2);
          warpCanvas.width = Math.round(rect.width * dpr);
          warpCanvas.height = Math.round(rect.height * dpr);
          textCanvas.width = warpCanvas.width;
          textCanvas.height = warpCanvas.height;

          var tctx = textCanvas.getContext("2d");
          tctx.clearRect(0, 0, textCanvas.width, textCanvas.height);
          var fontSize = Math.min(
            textCanvas.width / 9.4,
            textCanvas.height * 0.62
          );
          tctx.font =
            "800 " +
            fontSize +
            "px 'PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif";
          tctx.textAlign = "center";
          tctx.textBaseline = "middle";
          tctx.fillStyle = "#f8f5ff";
          tctx.fillText(warpText, textCanvas.width / 2, textCanvas.height / 2);
        }

        function drawWarp(time) {
          var reduceMotion = window.matchMedia(
            "(prefers-reduced-motion: reduce)"
          ).matches;
          var w = warpCanvas.width;
          var h = warpCanvas.height;
          warpCtx.clearRect(0, 0, w, h);
          if (!w || !h) return;

          if (reduceMotion || !textCanvas.width) {
            warpCtx.drawImage(textCanvas, 0, 0);
            warpFrame = 0;
            return;
          }

          var seconds = time * 0.001;
          var step = w > 1000 ? 2 : 1;
          var sourceH = textCanvas.height;
          var pointerX = warpPointerX * w;
          var radius = 0.42 * w * 0.45;
          var speed = 0.55;
          var warpStrength = 0.08;
          var warpScale = 1.7;
          var pointerStrength = 0.38;
          var refraction = 0.018;

          for (var x = 0; x < w; x += step) {
            var nx = x / w;
            var wave =
              Math.sin(nx * TAU * warpScale + seconds * speed * 4) *
              warpStrength *
              h *
              0.04;
            var dx = x - pointerX;
            var influence = Math.exp(-(dx * dx) / (2 * radius * radius));
            var pointerWave =
              Math.sin(dx * 0.022 + seconds * speed * 6) *
              pointerStrength *
              h *
              0.04 *
              influence;
            var rippleWave =
              Math.sin(dx * 0.07 - seconds * speed * 8) *
              pointerStrength *
              h *
              0.015 *
              influence;
            var shift =
              Math.sin(nx * TAU * warpScale * 0.5 + seconds * speed * 3) *
              refraction *
              h *
              0.1;
            var yOffset = wave + pointerWave + rippleWave;

            warpCtx.drawImage(
              textCanvas,
              x + shift,
              0,
              step,
              sourceH,
              x,
              yOffset,
              step,
              sourceH
            );
          }

          if (warpRunning) {
            warpFrame = requestAnimationFrame(drawWarp);
          } else {
            warpFrame = 0;
          }
        }

        function startWarp() {
          if (warpRunning) return;
          warpRunning = true;
          renderWarpText();
          warpFrame = requestAnimationFrame(drawWarp);
        }

        function triggerSurprise() {
          var intro = document.getElementById("intro");
          var nextWrap = document.getElementById("nextWrap");
          intro.hidden = true;
          greetingEl.hidden = false;
          nextWrap.hidden = false;
          currentMode = "color";
          currentRevealRadius = 1.4;
          state.targetX = 0.5;
          state.targetY = 0.5;
          rebuildPattern();
          spawnCelebration();
          startWarp();
        }

        document
          .getElementById("surpriseBtn")
          .addEventListener("click", triggerSurprise);
        window.addEventListener("resize", resizeConfetti);
        resizeConfetti();
        warpTitle.addEventListener("pointermove", function (event) {
          var rect = warpTitle.getBoundingClientRect();
          warpPointerX = clamp(
            (event.clientX - rect.left) / rect.width,
            0,
            1
          );
          warpPointerY = clamp(
            (event.clientY - rect.top) / rect.height,
            0,
            1
          );
        });
        warpTitle.addEventListener("pointerleave", function () {
          warpPointerX = 0.5;
          warpPointerY = 0.5;
        });
        window.addEventListener("resize", function () {
          if (!greetingEl.hidden) renderWarpText();
        });
      })();
    </script>
    <script src="public/page-transition.js"></script>
  </body>
</html>
